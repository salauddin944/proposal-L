<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff0f3">
<meta name="color-scheme" content="light dark">
<title>Love Proposal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg1: #fff0f3;
  --bg2: #ffd3df;
  --bg3: #ffc2d6;
  --ink: #3a0f24;
  --muted: #8d5069;
  --panel: rgba(255, 255, 255, .78);
  --line: rgba(158, 28, 78, .18);
  --rose: #d6246e;
  --rose2: #ff6b97;
  --gold: #b9801f;
  --field: #fff;
  --shadow: rgba(120, 0, 40, .12);
  --shadow-lg: rgba(120, 0, 40, .22);
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="dark"]) {
    --bg1: #1b0a1a;
    --bg2: #3b1030;
    --bg3: #521238;
    --ink: #ffe6ee;
    --muted: #d79ab4;
    --panel: rgba(44, 14, 36, .78);
    --line: rgba(255, 120, 166, .25);
    --rose: #ff5c8f;
    --rose2: #ff8fb3;
    --gold: #f3c677;
    --field: #2a0d23;
    --shadow: rgba(0, 0, 0, .35);
    --shadow-lg: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg1: #1b0a1a;
  --bg2: #3b1030;
  --bg3: #521238;
  --ink: #ffe6ee;
  --muted: #d79ab4;
  --panel: rgba(44, 14, 36, .78);
  --line: rgba(255, 120, 166, .25);
  --rose: #ff5c8f;
  --rose2: #ff8fb3;
  --gold: #f3c677;
  --field: #2a0d23;
  --shadow: rgba(0, 0, 0, .35);
  --shadow-lg: rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background-color: var(--bg1);
  background-image: linear-gradient(165deg, var(--bg1), var(--bg2));
  background-attachment: fixed;
  color: var(--ink);
  font-family: "DM Sans", system-ui, -apple-system, sans-serif;
  line-height: 1.6;
  overflow-x: hidden;
}

#bg {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

#bg i {
  position: absolute;
  bottom: -60px;
  font-style: normal;
  opacity: 0;
  animation: rise linear infinite;
  color: var(--rose2);
  filter: drop-shadow(0 0 6px var(--rose2));
}

@keyframes rise {
  10% { opacity: .55; }
  to { transform: translateY(-120vh) rotate(40deg); opacity: 0; }
}

.wrap {
  position: relative;
  z-index: 1;
  max-width: 580px;
  margin: 0 auto;
  padding: 28px 18px 56px;
  padding-top: max(28px, env(safe-area-inset-top));
  padding-bottom: max(56px, env(safe-area-inset-bottom));
  animation: fadeIn .7s ease both;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

h1, .q {
  font-family: "Cormorant Garamond", Georgia, serif;
  font-weight: 600;
  line-height: 1.08;
  margin: 0;
}

h1 {
  font-size: clamp(32px, 8vw, 52px);
  letter-spacing: -0.01em;
}

.sub {
  color: var(--muted);
  margin: 10px 0 24px;
  font-size: clamp(15px, 4vw, 17px);
  line-height: 1.6;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 22px;
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  box-shadow: 0 20px 60px var(--shadow), inset 0 1px 0 rgba(255,255,255,.35);
  transition: transform .3s ease, box-shadow .3s ease;
}

@media (hover: hover) and (pointer: fine) {
  .panel:hover {
    box-shadow: 0 24px 70px var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,.35);
  }
}

label {
  display: block;
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  margin: 18px 0 7px;
  color: var(--muted);
}

label:first-child { margin-top: 0; }

input, textarea {
  width: 100%;
  font: inherit;
  color: var(--ink);
  background: var(--field);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 13px 15px;
  font-size: 16px;
  transition: border-color .2s, box-shadow .2s, transform .15s;
  -webkit-appearance: none;
  appearance: none;
}

input:focus-visible, textarea:focus-visible, button:focus-visible {
  outline: 3px solid var(--rose2);
  outline-offset: 2px;
}

input:focus, textarea:focus {
  border-color: var(--rose);
  box-shadow: 0 0 0 4px rgba(214, 36, 110, .12);
}

textarea {
  min-height: 120px;
  resize: vertical;
  line-height: 1.55;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

@media (max-width: 380px) {
  .row { grid-template-columns: 1fr; gap: 0; }
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}

.chip {
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  background: transparent;
  border: 1.5px solid var(--line);
  border-radius: 99px;
  padding: 7px 14px;
  cursor: pointer;
  transition: all .2s ease;
  touch-action: manipulation;
}

.chip:hover, .chip:active {
  border-color: var(--rose);
  background: rgba(214, 36, 110, .08);
  transform: translateY(-1px);
}

.btn {
  font: inherit;
  font-weight: 600;
  border: 0;
  border-radius: 16px;
  padding: 15px 24px;
  cursor: pointer;
  color: #fff;
  background: linear-gradient(135deg, var(--rose), var(--rose2));
  box-shadow: 0 8px 24px rgba(214, 36, 110, .35);
  transition: transform .2s cubic-bezier(.34, 1.56, .64, 1), box-shadow .2s ease, filter .2s ease;
  font-size: 15px;
  touch-action: manipulation;
  -webkit-appearance: none;
  appearance: none;
  position: relative;
  overflow: hidden;
}

.btn::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,.25), transparent 60%);
  opacity: .4;
  pointer-events: none;
}

.btn:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 12px 32px rgba(214, 36, 110, .45);
}

.btn:active {
  transform: translateY(0) scale(.98);
  box-shadow: 0 4px 12px rgba(214, 36, 110, .3);
}

.btn.ghost {
  background: transparent;
  color: var(--ink);
  border: 1.5px solid var(--line);
  box-shadow: none;
}

.btn.ghost:hover {
  background: rgba(214, 36, 110, .06);
  border-color: var(--rose);
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 24px;
}

.share {
  margin-top: 18px;
  display: none;
  animation: fadeIn .4s ease both;
}

.share input {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 13px;
}

.share small {
  color: var(--muted);
  display: block;
  margin-top: 8px;
  font-size: 13px;
}

.stage {
  text-align: center;
  padding-top: 5vh;
  padding-top: 5dvh;
  animation: fadeIn .8s ease both;
}

.to {
  font-family: "Cormorant Garamond", Georgia, serif;
  font-style: italic;
  font-size: clamp(22px, 5.5vw, 30px);
  color: var(--gold);
  margin: 0 0 14px;
}

.q {
  font-size: clamp(38px, 11vw, 72px);
  letter-spacing: -0.015em;
}

.msg {
  min-height: 7.5em;
  margin: 24px auto 10px;
  max-width: 32em;
  font-size: clamp(16px, 4.2vw, 18px);
  white-space: pre-wrap;
  line-height: 1.7;
  color: var(--ink);
}

.from {
  color: var(--muted);
  margin: 0 0 28px;
  font-size: clamp(14px, 3.8vw, 16px);
}

.answers {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
  min-height: 100px;
  position: relative;
}

#yes {
  font-size: clamp(18px, 5vw, 22px);
  padding: 16px 44px;
  transition: transform .25s cubic-bezier(.34, 1.56, .64, 1);
  border-radius: 18px;
}

#no {
  background: transparent;
  color: var(--muted);
  border: 1.5px solid var(--line);
  padding: 12px 22px;
  font-size: 15px;
  box-shadow: none;
  transition: all .2s ease;
  touch-action: manipulation;
}

#no:hover {
  border-color: var(--rose);
  color: var(--rose);
  background: rgba(214, 36, 110, .06);
}

.big { font-size: clamp(46px, 13vw, 80px); }

.heartbeat {
  font-size: 64px;
  animation: beat 1.2s ease-in-out infinite;
  filter: drop-shadow(0 4px 10px rgba(214, 36, 110, .35));
}

@keyframes beat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.18); }
}

.fall {
  position: fixed;
  top: -50px;
  z-index: 5;
  pointer-events: none;
  animation: fall linear forwards;
  filter: drop-shadow(0 3px 5px rgba(0,0,0,.15));
}

@keyframes fall {
  to { transform: translateY(115vh) rotate(360deg); }
}

.art {
  width: min(220px, 58vw);
  margin: 0 auto;
  filter: drop-shadow(0 10px 18px rgba(120, 0, 40, .2));
  transition: transform .4s ease;
}

.art svg { width: 100%; height: auto; display: block; }

@media (hover: hover) and (pointer: fine) {
  .art:hover { transform: translateY(-4px) scale(1.03); }
}

.pair {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 8px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}

.pair .art {
  margin: 0;
  width: min(200px, 44vw);
}

.kit { margin-top: 24px; width: min(160px, 46vw); }

.blink {
  transform-box: fill-box;
  transform-origin: center;
  animation: blink 4s infinite;
}

@keyframes blink {
  0%, 94%, 100% { transform: scaleY(1); }
  97% { transform: scaleY(.1); }
}

.env {
  position: relative;
  display: block;
  width: min(340px, 88vw);
  height: 220px;
  margin: 34px auto 20px;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  perspective: 1000px;
  font: inherit;
  animation: bob 2.8s ease-in-out infinite;
  -webkit-tap-highlight-color: transparent;
}

.env.open { animation: none; }

@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.env span { position: absolute; display: block; }

.env .body {
  inset: 0;
  background: linear-gradient(135deg, #f2b8ca, #ea9db5);
  border-radius: 12px;
  box-shadow: 0 20px 40px rgba(120, 0, 40, .3);
  z-index: 1;
}

.env .letter {
  left: 16px;
  right: 16px;
  top: 16px;
  bottom: 16px;
  background: linear-gradient(180deg, #fffdf8, #fff5f7);
  border-radius: 8px;
  z-index: 2;
  transition: transform .9s .5s cubic-bezier(.22, 1, .36, 1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: clamp(22px, 6vw, 30px);
  color: #3a0f24;
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
  border: 1px solid rgba(158, 28, 78, .1);
}

.env .front {
  inset: 0;
  background: linear-gradient(180deg, #f7cdd9, #f2b8ca);
  clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%);
  border-radius: 12px;
  z-index: 3;
}

.env .flap {
  left: 0;
  right: 0;
  top: 0;
  height: 56%;
  background: linear-gradient(180deg, #ea9db5, #e08fa8);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top;
  transition: transform .7s cubic-bezier(.4, 0, .2, 1);
  z-index: 4;
}

.env .seal {
  left: 50%;
  top: 56%;
  width: 50px;
  height: 50px;
  margin: -25px 0 0 -25px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--rose), var(--rose2));
  color: #fff;
  font-size: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;
  transition: opacity .35s ease, transform .35s ease;
  box-shadow: 0 4px 12px rgba(0,0,0,.25);
}

.env:hover .seal { transform: translate(-50%, -50%) scale(1.08); }

.env.open .flap { transform: rotateX(180deg); z-index: 0; }
.env.open .seal { opacity: 0; transform: scale(.6); }
.env.open .letter { transform: translateY(-105px); }

.theme-toggle {
  position: fixed;
  top: max(14px, env(safe-area-inset-top));
  right: max(14px, env(safe-area-inset-right));
  z-index: 10;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  background: var(--panel);
  backdrop-filter: blur(10px);
  color: var(--ink);
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 14px var(--shadow);
  transition: transform .2s ease, box-shadow .2s ease;
  touch-action: manipulation;
}

.theme-toggle:hover { transform: scale(1.08); box-shadow: 0 6px 20px var(--shadow-lg); }

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  background: transparent;
  border: 1.5px solid var(--line);
  border-radius: 99px;
  padding: 8px 16px;
  cursor: pointer;
  transition: all .2s ease;
  touch-action: manipulation;
}

.back-btn:hover {
  border-color: var(--rose);
  color: var(--rose);
  background: rgba(214, 36, 110, .06);
}

@media (max-width: 360px) {
  .wrap { padding: 22px 14px 44px; }
  .panel { padding: 18px; border-radius: 20px; }
  .actions { gap: 10px; }
  .btn { padding: 14px 20px; width: 100%; justify-content: center; }
  .answers { gap: 14px; }
  #yes { width: auto; }
  .env { height: 190px; }
  .env .letter { left: 12px; right: 12px; top: 12px; bottom: 12px; }
}

@media (min-width: 768px) {
  .wrap { padding: 44px 24px 72px; }
  .panel { padding: 28px; }
  .stage { padding-top: 8vh; }
}

@media (prefers-reduced-motion: reduce) {
  #bg i, .heartbeat, .env, .blink, .wrap, .stage, .share, .fall { animation: none; }
  .fall { animation-duration: .01s; }
  .env .letter, .env .flap, .env .seal, .btn, .chip, .art, .panel { transition: none; }
}

@media (hover: none) and (pointer: coarse) {
  .btn { padding: 16px 24px; }
  .chip { padding: 9px 16px; }
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<button class="theme-toggle" id="themeBtn" aria-label="Toggle dark mode">☀️</button>
<main class="wrap" id="app"></main>

<script>
(function() {
  var app = document.getElementById('app');
  var themeBtn = document.getElementById('themeBtn');
  var DEF = { from: '', to: '', q: 'Will you marry me?', msg: 'From the moment you walked into my life, everything got brighter. I can’t picture a single day without you, and I never want to.' };
  var QS = ['Will you marry me?', 'Will you be my Valentine?', 'Will you be mine?', 'Will you go out with me?'];
  var NO = ['No', 'Are you sure?', 'Really sure?', 'Think again…', 'Pretty please?', 'Don’t break my heart', 'Last chance!', 'You’re teasing me', 'Okay, I’ll wait 🥺'];

  function setTheme(dark) {
    if (dark) { document.documentElement.setAttribute('data-theme', 'dark'); themeBtn.textContent = '🌙'; }
    else { document.documentElement.removeAttribute('data-theme'); themeBtn.textContent = '☀️'; }
    try { localStorage.setItem('lp_theme', dark ? 'dark' : 'light'); } catch(e) {}
  }

  var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  var stored = '';
  try { stored = localStorage.getItem('lp_theme') || ''; } catch(e) {}
  if (stored === 'dark' || (!stored && prefersDark)) setTheme(true);
  else setTheme(false);

  themeBtn.addEventListener('click', function() {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    setTheme(!isDark);
  });

  var bg = document.getElementById('bg');
  for (var i = 0; i < 18; i++) {
    var h = document.createElement('i');
    h.textContent = '♥';
    h.style.left = Math.random() * 100 + '%';
    h.style.fontSize = (14 + Math.random() * 28) + 'px';
    h.style.animationDuration = (10 + Math.random() * 10) + 's';
    h.style.animationDelay = (-Math.random() * 16) + 's';
    bg.appendChild(h);
  }

  function enc(o) {
    try { return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
    catch(e) { return ''; }
  }
  function dec(t) {
    try { t = t.replace(/-/g, '+').replace(/_/g, '/'); while (t.length % 4) t += '='; return JSON.parse(decodeURIComponent(escape(atob(t)))); }
    catch(e) { return null; }
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var state = Object.assign({}, DEF);

  function builder() {
    app.innerHTML = '<button class="back-btn" id="backHome" style="display:none"></button>' +
      '<h1>Ask the question,<br>beautifully.</h1>' +
      '<p class="sub">Write your proposal, preview it, then send the link. Your person gets a button that says yes—and one that’s very hard to press.</p>' +
      '<div class="panel"><div class="row"><div><label for="to">Their name</label><input id="to" maxlength="40" placeholder="Maya" value="' + esc(state.to) + '"></div><div><label for="from">Your name</label><input id="from" maxlength="40" placeholder="Alex" value="' + esc(state.from) + '"></div></div>' +
      '<label for="q">The question</label><input id="q" maxlength="60" value="' + esc(state.q) + '"><div class="chips">' + QS.map(function(q){ return '<button type="button" class="chip">' + esc(q) + '</button>'; }).join('') + '</div>' +
      '<label for="msg">Your message</label><textarea id="msg" maxlength="400">' + esc(state.msg) + '</textarea>' +
      '<div class="actions"><button class="btn" id="prev">Preview proposal</button><button class="btn ghost" id="copy">Copy share link</button></div>' +
      '<div class="share" id="share"><input id="link" readonly aria-label="Share link"><small id="note"></small></div></div>';

    var $ = function(id){ return document.getElementById(id); };
    function read() {
      state.to = $('to').value.trim();
      state.from = $('from').value.trim();
      state.q = $('q').value.trim() || DEF.q;
      state.msg = $('msg').value.trim();
    }
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(c){
      c.onclick = function(){ $('q').value = c.textContent; };
    });
    $('prev').onclick = function(){ read(); if(!state.to){ $('to').focus(); return; } mail(state, true); };
    $('copy').onclick = function(){
      read(); if(!state.to){ $('to').focus(); return; }
      var url = location.href.split('#')[0] + '#' + enc(state);
      $('share').style.display = 'block'; $('link').value = url; $('link').select();
      var done = function(ok){ $('note').textContent = ok ? 'Link copied. Send it when the moment is right.' : 'Copy the link above and send it.'; };
      try { navigator.clipboard.writeText(url).then(function(){ done(true); }, function(){ done(false); }); }
      catch(e){ done(false); }
    };
  }

  function rose(x, y, r, g) {
    var p = '<g transform="translate(' + x + ' ' + y + ')">', i, s = ' stroke="rgba(90,0,30,.38)" stroke-width="1"';
    for(i = 0; i < 6; i++) p += '<ellipse cx="0" cy="' + (-r*.55) + '" rx="' + (r*.52) + '" ry="' + (r*.58) + '" transform="rotate(' + (i*60) + ')" fill="url(#' + g + ')"' + s + '/>';
    for(i = 0; i < 5; i++) p += '<ellipse cx="0" cy="' + (-r*.32) + '" rx="' + (r*.34) + '" ry="' + (r*.4) + '" transform="rotate(' + (i*72+25) + ')" fill="url(#' + g + ')"' + s + '/>';
    p += '<circle r="' + (r*.24) + '" fill="url(#' + g + ')"' + s + '/><path d="M' + (-r*.12) + ' 0a' + (r*.12) + ' ' + (r*.12) + ' 0 1 1 ' + (r*.18) + ' ' + (r*.06) + '" fill="none" stroke="rgba(90,0,30,.55)" stroke-width="1.2" stroke-linecap="round"/></g>';
    return p;
  }

  var BOUQUET = '<svg viewBox="0 0 240 210" role="img" aria-label="Bouquet of roses"><defs><radialGradient id="gR"><stop offset="0" stop-color="#b3103a"/><stop offset="1" stop-color="#ff5d83"/></radialGradient><radialGradient id="gP"><stop offset="0" stop-color="#e8467f"/><stop offset="1" stop-color="#ffc2d6"/></radialGradient></defs>' +
    '<g stroke="#2e7d4f" stroke-width="5" stroke-linecap="round" fill="none"><path d="M120 200C118 150 80 120 70 82"/><path d="M120 200C120 150 120 110 120 84"/><path d="M120 200C124 150 160 120 170 84"/></g>' +
    '<g fill="#3c9a62"><ellipse cx="92" cy="140" rx="20" ry="8" transform="rotate(-35 92 140)"/><ellipse cx="150" cy="138" rx="20" ry="8" transform="rotate(35 150 138)"/><ellipse cx="108" cy="165" rx="16" ry="6" transform="rotate(-20 108 165)"/><ellipse cx="136" cy="165" rx="16" ry="6" transform="rotate(20 136 165)"/></g>' +
    '<g fill="#fff" opacity=".92"><circle cx="40" cy="70" r="4"/><circle cx="52" cy="52" r="3"/><circle cx="200" cy="66" r="4"/><circle cx="190" cy="46" r="3"/><circle cx="96" cy="26" r="3"/><circle cx="146" cy="24" r="4"/><circle cx="30" cy="96" r="3"/><circle cx="212" cy="92" r="3"/></g>' +
    rose(70, 78, 30, 'gP') + rose(170, 80, 30, 'gP') + rose(120, 56, 38, 'gR') +
    '<path d="M120 192l-26-14v28zM120 192l26-14v28z" fill="#d6246e"/><circle cx="120" cy="192" r="6" fill="#b3103a"/></svg>';

  var KITTEN = '<svg viewBox="0 0 200 195" role="img" aria-label="Cute kitten"><path d="M148 160C195 150 198 108 176 96" stroke="#e8923f" stroke-width="15" fill="none" stroke-linecap="round"/>' +
    '<ellipse cx="100" cy="150" rx="56" ry="40" fill="#f4a259"/><ellipse cx="100" cy="162" rx="30" ry="22" fill="#fff4e6"/>' +
    '<path d="M58 82L60 36L96 58Z" fill="#f4a259"/><path d="M142 82L140 36L104 58Z" fill="#f4a259"/><path d="M65 70L66 48L84 60Z" fill="#ffb3c4"/><path d="M135 70L134 48L116 60Z" fill="#ffb3c4"/>' +
    '<circle cx="100" cy="94" r="46" fill="#f4a259"/><path d="M100 50v14M88 52l3 12M112 52l-3 12" stroke="#d9822f" stroke-width="4" stroke-linecap="round"/><ellipse cx="100" cy="112" rx="24" ry="17" fill="#fff4e6"/>' +
    '<g class="blink"><ellipse cx="80" cy="92" rx="8" ry="10.5" fill="#2b1b17"/><ellipse cx="120" cy="92" rx="8" ry="10.5" fill="#2b1b17"/></g><circle cx="83" cy="88" r="3" fill="#fff"/><circle cx="123" cy="88" r="3" fill="#fff"/>' +
    '<circle cx="64" cy="108" r="7" fill="#ff9fb5" opacity=".55"/><circle cx="136" cy="108" r="7" fill="#ff9fb5" opacity=".55"/>' +
    '<path d="M94 104h12l-6 7z" fill="#ff6f95"/><path d="M100 111q-5 8-11 3M100 111q5 8 11 3" stroke="#7a3b2a" stroke-width="1.8" fill="none" stroke-linecap="round"/>' +
    '<path d="M72 108l-26-5M72 113l-26 6M128 108l26-5M128 113l26 6" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>' +
    '<ellipse cx="78" cy="178" rx="16" ry="10" fill="#fff4e6"/><ellipse cx="122" cy="178" rx="16" ry="10" fill="#fff4e6"/>' +
    '<path d="M100 186c-14-9-20-17-14-23 5-4 11-1 14 4 3-5 9-8 14-4 6 6 0 14-14 23z" fill="#ff3d78"/></svg>';

  function mail(d, preview) {
    app.innerHTML = '<div class="stage"><p class="to">A new letter</p><h1 style="font-size:clamp(30px,8.5vw,52px)" class="q">' + (d.from ? esc(d.from) + ' sent you a letter' : 'Someone sent you a letter') + '</h1><p class="sub" style="margin-bottom:0">Just for ' + esc(d.to) + '. Tap the envelope to open it.</p>' +
      '<button class="env" id="env" aria-label="Open the letter"><span class="body"></span><span class="letter">For ' + esc(d.to) + '</span><span class="front"></span><span class="flap"></span><span class="seal">♥</span></button>' +
      '<div class="art" style="width:min(180px,50vw)" aria-hidden="true">' + BOUQUET + '</div></div>';
    var env = document.getElementById('env'), opened = false;
    env.onclick = function(){ if(opened) return; opened = true; env.classList.add('open'); setTimeout(function(){ proposal(d, preview); }, 1600); };
  }

  function confetti(n) {
    var E = ['💖','💗','💕','❤️','✨','🌹'];
    for(var i = 0; i < n; i++){
      var s = document.createElement('span');
      s.className = 'fall';
      s.textContent = E[i % E.length];
      s.style.left = Math.random() * 100 + 'vw';
      s.style.fontSize = (16 + Math.random() * 26) + 'px';
      s.style.animationDuration = (2.5 + Math.random() * 3) + 's';
      s.style.animationDelay = (Math.random() * 1.5) + 's';
      document.body.appendChild(s);
      (function(el){ setTimeout(function(){ el.remove(); }, 7500); })(s);
    }
  }

  function proposal(d, preview) {
    var tries = 0, timer = null;
    app.innerHTML = '<div class="stage"><button class="back-btn" id="back">← Back</button><div class="art" aria-hidden="true">' + BOUQUET + '</div><p class="to">' + esc(d.to) + ',</p><h2 class="q" style="font-size:clamp(38px,11.5vw,72px)">' + esc(d.q) + '</h2><p class="msg" id="m" aria-live="polite"></p>' +
      '<p class="from">' + (d.from ? '— ' + esc(d.from) : '') + '</p><div class="answers"><button class="btn" id="yes">Yes ♥</button><button class="btn" id="no">No</button></div><div class="art kit" aria-hidden="true">' + KITTEN + '</div></div>';

    var m = document.getElementById('m'), yes = document.getElementById('yes'), no = document.getElementById('no'), txt = d.msg || '', k = 0;
    var back = document.getElementById('back');
    if(back) back.onclick = function(){ if(preview) builder(); else mail(d, false); };

    if(window.matchMedia('(prefers-reduced-motion:reduce)').matches){ m.textContent = txt; }
    else { timer = setInterval(function(){ k++; m.textContent = txt.slice(0, k); if(k >= txt.length) clearInterval(timer); }, 30); }

    var isTouch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;

    function dodge(e) {
      if(e){ e.preventDefault(); }
      tries++;
      no.textContent = NO[Math.min(tries, NO.length - 1)];
      yes.style.transform = 'scale(' + Math.min(1 + tries * .11, 2.2) + ')';
      no.style.position = 'fixed';
      no.style.zIndex = '6';

      var vw = window.innerWidth;
      var vh = window.innerHeight;
      var rect = no.getBoundingClientRect();
      var w = rect.width || 80;
      var h = rect.height || 44;
      var margin = 16;

      var maxX = vw - w - margin;
      var maxY = vh - h - margin;
      var minX = margin;
      var minY = margin;

      var x, y;
      if (isTouch && e && e.clientX != null) {
        var angle = Math.random() * Math.PI * 2;
        var dist = 90 + Math.random() * 100;
        x = e.clientX + Math.cos(angle) * dist - w/2;
        y = e.clientY + Math.sin(angle) * dist - h/2;
      } else {
        x = Math.random() * (maxX - minX) + minX;
        y = Math.random() * (maxY - minY) + minY;
      }
      x = Math.max(minX, Math.min(maxX, x));
      y = Math.max(minY, Math.min(maxY, y));
      no.style.left = x + 'px';
      no.style.top = y + 'px';
      no.style.transition = 'left .25s ease, top .25s ease';
    }

    no.addEventListener('pointerenter', dodge);
    no.addEventListener('pointerdown', dodge);
    no.addEventListener('click', dodge);

    yes.onclick = function(){
      clearInterval(timer);
      app.innerHTML = '<div class="stage"><div class="pair" aria-hidden="true"><div class="art">' + BOUQUET + '</div><div class="art">' + KITTEN + '</div></div><h2 class="q big">' + esc(d.to) + ' said yes!</h2><p class="msg" style="min-height:0">' + (d.from ? esc(d.from) + ' & ' + esc(d.to) + ', officially.' : 'Officially.') + '</p>' +
        '<div class="actions" style="justify-content:center"><button class="btn ghost" id="again">Celebrate again</button></div></div>';
      confetti(80);
      document.getElementById('again').onclick = function(){ confetti(80); };
    };
  }

  var hash = location.hash.slice(1), d = hash ? dec(hash) : null;
  if(d && d.to && d.q){ mail(d, false); }
  else { builder(); }

  window.addEventListener('hashchange', function(){
    var x = dec(location.hash.slice(1));
    if(x && x.to && x.q) mail(x, false);
  });
})();
</script>
</body>
